server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    resolver 127.0.0.11 valid=1s;

    #charset utf-8;
    #access_log  /var/log/nginx/host.access.log  main;

    # XSS and NoCache headers

    add_header "Cache-Control" "max-age=0, no-cache, no-store, must-revalidate";
    add_header "Pragma" "no-cache";
    add_header "Expires" "-1";
    add_header "X-Frame-Options" "DENY";
    add_header "X-XSS-Protection" "1; mode=block";
    add_header "X-Content-Type-Options" "nosniff";
    add_header "X-Download-Options" "noopen";
    add_header "X-Permitted-Cross-Domain-Policies" "none";
    add_header "Referrer-Policy" "strict-origin-when-cross-origin" always;
    add_header "Permissions-Policy" "camera=(), microphone=(), geolocation=()" always;
    add_header "Content-Security-Policy" "default-src 'self' __NGINX_HOST__ https: data: blob: 'unsafe-inline'; connect-src 'self' https: wss: wss://client.relay.crisp.chat; frame-ancestors 'self'; form-action 'self' __NGINX_HOST__ https://github.com; object-src 'none'; base-uri 'self'" always;
    server_tokens off;

    # has no effect with HTTPS load-balancer unwrap
    # ssl_protocols TLSv1.2;

    location ~* "^/[0-9a-f]{64}(/[^/]+)?$" {
        resolver 127.0.0.11 valid=1s;
        set $endpoint "api";
        proxy_pass http://$endpoint:7442;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location ~* ^/api/ {
        resolver 127.0.0.11 valid=1s;
        set $endpoint "api";
        rewrite ^(.*) $1 break;
        proxy_pass http://$endpoint:7442;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    location ~* ^/device/ {
        resolver 127.0.0.11 valid=1s;
        set $endpoint "api";
        rewrite ^(.*) $1 break;
        proxy_pass http://$endpoint:7442;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
    }

    location /status {
        stub_status on;
        access_log off;
    }

    location /server_status {
        stub_status on;
        access_log off;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    error_log /var/log/nginx/error.log warn;
}
